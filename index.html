<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>تواريخ</title>
<meta name="description" content="تطبيق تفاعلي لمراجعة تواريخ دروس التاريخ للسنة الرابعة متوسط">
<meta name="theme-color" content="#0f0c29">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="تواريخ">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&family=Poppins:wght@400;600;700&display=swap');
  :root{
    --bg:#0f0c29; --card:#1a1545; --card2:#231d5c; --accent:#7c5cfc;
    --accent2:#ff6b9d; --gold:#ffd166; --green:#06d6a0; --red:#ef476f;
    --blue:#4cc9f0; --text:#f0eeff; --muted:#a09ec0; --radius:18px;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:'Tajawal',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;}
  body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(124,92,252,.15) 0%,transparent 60%),radial-gradient(ellipse at 80% 20%,rgba(255,107,157,.12) 0%,transparent 60%);pointer-events:none;z-index:0;}
  .stars{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;}
  .star{position:absolute;width:2px;height:2px;background:#fff;border-radius:50%;animation:twinkle var(--d,3s) infinite var(--del,0s);}
  @keyframes twinkle{0%,100%{opacity:.2;transform:scale(1);}50%{opacity:1;transform:scale(1.5);}}
  .screen{position:relative;z-index:1;display:none;min-height:100vh;padding:20px 16px 30px;max-width:560px;margin:0 auto;}
  .screen.active{display:flex;flex-direction:column;}

  /* HOME */
  .home-logo{text-align:center;margin:20px 0 8px;}
  .logo-icon{font-size:52px;display:block;animation:float 3s ease-in-out infinite;}
  @keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-10px);}}
  .home-title{font-size:22px;font-weight:900;text-align:center;background:linear-gradient(135deg,#7c5cfc,#ff6b9d,#ffd166);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:4px;line-height:1.35;}
  .home-sub{text-align:center;color:var(--muted);font-size:13.5px;margin-bottom:18px;}
  .stat-row{display:flex;gap:8px;margin-bottom:16px;}
  .stat-box{flex:1;background:var(--card);border:1.5px solid rgba(124,92,252,.3);border-radius:14px;padding:10px 4px;text-align:center;}
  .stat-num{font-family:'Poppins',sans-serif;font-size:19px;font-weight:700;color:var(--gold);}
  .stat-label{font-size:10.5px;color:var(--muted);margin-top:2px;}

  .name-card{background:var(--card);border:1.5px solid rgba(124,92,252,.35);border-radius:16px;padding:12px 14px;margin-bottom:14px;display:flex;align-items:center;gap:10px;}
  .name-card .nc-icon{font-size:20px;flex-shrink:0;}
  .name-input{flex:1;min-width:0;background:transparent;border:none;outline:none;color:var(--text);font-family:'Tajawal',sans-serif;font-size:14px;font-weight:700;}
  .name-input::placeholder{color:var(--muted);font-weight:500;}
  .name-saved{font-size:11px;color:var(--green);font-weight:700;opacity:0;transition:opacity .3s;flex-shrink:0;}
  .name-saved.show{opacity:1;}

  .group-card{width:100%;border:none;border-radius:20px;padding:16px 16px;cursor:pointer;color:#fff;font-family:'Tajawal',sans-serif;text-align:right;display:flex;align-items:center;gap:14px;margin-bottom:12px;box-shadow:0 8px 20px rgba(0,0,0,.3), inset 0 0 0 1px rgba(255,255,255,.08);transition:all .2s;}
  .group-card:hover{transform:translateY(-3px);filter:brightness(1.07);}
  .group-card:active{transform:translateY(0);}
  .gc-icon{font-size:30px;width:52px;height:52px;flex-shrink:0;background:rgba(255,255,255,.16);border-radius:16px;display:flex;align-items:center;justify-content:center;}
  .gc-body{flex:1;min-width:0;}
  .gc-title{font-size:15.5px;font-weight:900;margin-bottom:2px;}
  .gc-sub{font-size:11.5px;opacity:.88;font-weight:500;margin-bottom:6px;}
  .gc-count{display:inline-flex;align-items:center;gap:4px;background:rgba(0,0,0,.22);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:700;}
  .gc-badge{display:inline-flex;align-items:center;gap:4px;background:rgba(255,209,102,.22);color:#fff;border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;font-family:'Poppins',sans-serif;}
  .gc-arrow{font-size:20px;opacity:.85;flex-shrink:0;}
  .gc-mini-progress{background:rgba(0,0,0,.25);border-radius:8px;height:5px;margin-top:8px;overflow:hidden;}
  .gc-mini-fill{height:100%;background:#fff;border-radius:8px;}
  .g1{background:linear-gradient(120deg,#3a86ff,#4cc9f0);}
  .g2{background:linear-gradient(120deg,#7c5cfc,#9d4edd);}
  .g3{background:linear-gradient(120deg,#e85d04,#ff9f43);}
  .g4{background:linear-gradient(120deg,#009e73,#06d6a0);}
  .g5{background:linear-gradient(120deg,#c9184a,#ff6b9d);}
  .g6{background:linear-gradient(120deg,#00b4d8,#0096c7);}

  /* HEADER / BACK */
  .top-bar{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;gap:10px;}
  .back-btn{background:var(--card);border:none;color:var(--muted);width:38px;height:38px;border-radius:50%;font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:all .2s;flex-shrink:0;}
  .back-btn:hover{background:var(--card2);color:var(--text);}
  .top-title{flex:1;text-align:center;}
  .top-title h2{font-size:16.5px;font-weight:900;}
  .top-title span{font-size:11.5px;color:var(--muted);}
  .top-spacer{width:38px;flex-shrink:0;}

  /* GROUP MENU (lesson/quiz choice) */
  .mode-card{width:100%;padding:26px 18px;border:none;border-radius:var(--radius);color:#fff;font-family:'Tajawal',sans-serif;font-size:18px;font-weight:900;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;transition:all .2s;margin-bottom:16px;box-shadow:0 8px 22px rgba(0,0,0,.3);}
  .mode-card:hover{transform:translateY(-3px);}
  .mode-card .mc-emoji{font-size:38px;}
  .mode-card .mc-desc{font-size:12px;font-weight:500;opacity:.85;}
  .mode-lesson{background:linear-gradient(135deg,#3a86ff,#4cc9f0);}
  .mode-quiz{background:linear-gradient(135deg,#7c5cfc,#ff6b9d);}
  .mode-info{background:var(--card);border:1.5px solid rgba(124,92,252,.3);border-radius:var(--radius);padding:16px;font-size:13px;color:var(--muted);line-height:1.9;text-align:center;}
  .mode-info b{color:var(--gold);}

  /* LESSON LIST */
  .lesson-list{display:flex;flex-direction:column;gap:10px;}
  .lesson-item{background:linear-gradient(160deg,var(--card),var(--card2));border-radius:16px;padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:0 4px 14px rgba(0,0,0,.22), inset 0 0 0 1px rgba(255,255,255,.06);animation:popIn .3s ease;}
  @keyframes popIn{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:translateY(0);}}
  .li-num{width:26px;height:26px;border-radius:50%;background:rgba(124,92,252,.25);color:var(--gold);font-family:'Poppins',sans-serif;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .li-body{flex:1;min-width:0;}
  .li-event{font-size:13.5px;font-weight:700;line-height:1.5;}
  .li-date{margin-top:5px;display:inline-block;background:rgba(255,209,102,.15);color:var(--gold);border:1px solid rgba(255,209,102,.4);border-radius:20px;padding:3px 12px;font-size:12px;font-weight:800;}
  .lesson-cat-header{margin:18px 0 4px;padding:8px 14px;background:rgba(124,92,252,.16);border-right:4px solid var(--accent2);border-radius:10px;font-size:13.5px;font-weight:900;color:#fff;}
  .lesson-cat-header:first-child{margin-top:0;}

  /* QUIZ */
  .score-mini{display:flex;gap:8px;}
  .score-pill{border-radius:20px;padding:5px 12px;font-size:12px;font-weight:700;display:flex;align-items:center;gap:4px;}
  .score-pill.ok{background:rgba(6,214,160,.15);color:var(--green);border:1.5px solid rgba(6,214,160,.4);}
  .score-pill.no{background:rgba(239,71,111,.15);color:var(--red);border:1.5px solid rgba(239,71,111,.4);}
  .q-counter{color:var(--muted);font-size:12px;font-family:'Poppins',sans-serif;text-align:center;margin-bottom:6px;}
  .progress-wrap{background:rgba(255,255,255,.08);border-radius:10px;height:8px;margin-bottom:18px;overflow:hidden;}
  .progress-fill{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2));border-radius:10px;transition:width .4s ease;}
  .q-card{background:var(--card);border:1.5px solid rgba(124,92,252,.3);border-radius:var(--radius);padding:20px 18px;margin-bottom:18px;text-align:center;}
  .q-kind{font-size:11.5px;color:var(--gold);font-weight:700;margin-bottom:8px;}
  .q-text{font-size:16.5px;font-weight:800;line-height:1.7;}
  .q-text.dir-ltr{}
  .opt-list{display:flex;flex-direction:column;gap:10px;}
  .opt-btn{background:linear-gradient(160deg,var(--card),var(--card2));border:2px solid transparent;border-radius:16px;padding:15px 14px;cursor:pointer;font-family:'Tajawal',sans-serif;color:var(--text);font-size:14px;font-weight:700;text-align:center;transition:all .2s;box-shadow:0 4px 12px rgba(0,0,0,.2), inset 0 0 0 1px rgba(255,255,255,.06);}
  .opt-btn.opt-date{}
  .opt-btn:hover:not(:disabled){transform:translateY(-2px);filter:brightness(1.1);}
  .opt-btn:disabled{cursor:default;}
  .opt-btn.correct{background:linear-gradient(135deg,#06d6a0,#2ec4b6);color:#04241c;border-color:transparent;}
  .opt-btn.wrong{background:linear-gradient(135deg,#ef476f,#c9184a);color:#fff;border-color:transparent;}
  .opt-btn.dim{opacity:.45;}
  .next-btn{margin-top:16px;width:100%;padding:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;border-radius:var(--radius);color:#fff;font-family:'Tajawal',sans-serif;font-size:15.5px;font-weight:900;cursor:pointer;box-shadow:0 8px 20px rgba(124,92,252,.4);display:none;}
  .next-btn.show{display:block;}

  /* RESULT */
  .result-wrap{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
  .result-emoji{font-size:64px;margin-bottom:12px;animation:float 3s ease-in-out infinite;}
  .result-title{font-size:20px;font-weight:900;margin-bottom:6px;}
  .result-sub{color:var(--muted);font-size:13.5px;margin-bottom:22px;}
  .result-score{font-family:'Poppins',sans-serif;font-size:44px;font-weight:700;color:var(--gold);margin-bottom:26px;}
  .result-btns{width:100%;display:flex;flex-direction:column;gap:10px;}
  .result-btn{padding:16px;border:none;border-radius:var(--radius);font-family:'Tajawal',sans-serif;font-size:15.5px;font-weight:900;cursor:pointer;}
  .result-btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 8px 20px rgba(124,92,252,.4);}
  .result-btn.secondary{background:var(--card);color:var(--text);border:2px solid rgba(124,92,252,.35);}

  .confetti-piece{position:fixed;top:-10px;width:9px;height:9px;z-index:50;pointer-events:none;animation:confettiFall linear forwards;}
  @keyframes confettiFall{to{transform:translateY(110vh) rotate(540deg);opacity:.3;}}

  .bottom-back{width:100%;margin-top:auto;padding-top:16px;}
  .bottom-back-inner{width:100%;padding:16px;background:linear-gradient(160deg,var(--card),var(--card2));border:2px solid rgba(239,71,111,.45);border-radius:var(--radius);color:var(--text);font-family:'Tajawal',sans-serif;font-size:15.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;}
  .bottom-back-inner:hover{border-color:var(--red);background:rgba(239,71,111,.14);}

  .install-btn{width:100%;display:none;align-items:center;justify-content:center;gap:8px;padding:12px;margin-bottom:14px;background:linear-gradient(135deg,var(--gold),#e6aa3c);color:#241a00;border:none;border-radius:14px;font-family:'Tajawal',sans-serif;font-size:13.5px;font-weight:800;cursor:pointer;box-shadow:0 6px 16px rgba(255,209,102,.3);}
  .install-btn.show{display:flex;}
</style>
</head>
<body>
<div class="stars" id="stars"></div>

<!-- HOME -->
<div class="screen active" id="homeScreen">
  <div class="home-logo"><span class="logo-icon">🇩🇿</span></div>
  <div class="home-title">تواريخ دروس التاريخ<br>السنة الرابعة متوسط</div>
  <div class="home-sub">اختر المجموعة لمراجعة الدرس أو خوض الاختبار</div>

  <button class="install-btn" id="installBtn">📲 تثبيت التطبيق على الجهاز</button>

  <div class="name-card">
    <span class="nc-icon">🧑‍🎓</span>
    <input type="text" id="studentNameInput" class="name-input" placeholder="اكتب اسمك هنا يا تلميذ...">
    <span class="name-saved" id="nameSavedTag">✔ تم الحفظ</span>
  </div>

  <div class="stat-row">
    <div class="stat-box"><div class="stat-num" id="statGroups">6</div><div class="stat-label">مجموعات</div></div>
    <div class="stat-box"><div class="stat-num" id="statEvents">0</div><div class="stat-label">حدث تاريخي</div></div>
    <div class="stat-box"><div class="stat-num" id="statProgress">0%</div><div class="stat-label">نسبة التقدم</div></div>
  </div>
  <div id="groupsList"></div>
</div>

<!-- GROUP MENU -->
<div class="screen" id="groupMenuScreen">
  <div class="top-bar">
    <button class="back-btn" id="gmBackBtn">→</button>
    <div class="top-title"><h2 id="gmTitle"></h2><span id="gmSub"></span></div>
    <div class="top-spacer"></div>
  </div>
  <div class="mode-info" id="gmProgressBox" style="margin-bottom:16px;"></div>
  <button class="mode-card mode-lesson" id="gmLessonBtn">
    <span class="mc-emoji">📖</span>
    <span>الدرس</span>
    <span class="mc-desc">مراجعة الأحداث والتواريخ بالترتيب</span>
  </button>
  <button class="mode-card mode-quiz" id="gmQuizBtn">
    <span class="mc-emoji">📝</span>
    <span>الاختبار</span>
    <span class="mc-desc">اختبر حفظك للتواريخ بأسئلة تخير من متعدد</span>
  </button>
  <div class="mode-info">ملاحظة: <b>التواريخ مرتبة حسب الدروس المبرمجة</b>. بالتوفيق للجميع 🌟</div>
</div>

<!-- LESSON -->
<div class="screen" id="lessonScreen">
  <div class="top-bar">
    <button class="back-btn" id="lessonBackBtn">→</button>
    <div class="top-title"><h2 id="lessonTitle"></h2><span id="lessonSub"></span></div>
    <div class="top-spacer"></div>
  </div>
  <div class="lesson-list" id="lessonList"></div>
  <div class="bottom-back">
    <button class="bottom-back-inner" id="lessonBottomBack">↩ رجوع للمجموعة</button>
  </div>
</div>

<!-- QUIZ -->
<div class="screen" id="quizScreen">
  <div class="top-bar">
    <button class="back-btn" id="quizBackBtn">→</button>
    <div class="top-title"><h2 id="quizTitle"></h2></div>
    <div class="score-mini">
      <div class="score-pill ok">✔ <span id="scoreOk">0</span></div>
      <div class="score-pill no">✘ <span id="scoreNo">0</span></div>
    </div>
  </div>
  <div class="q-counter" id="qCounter"></div>
  <div class="progress-wrap"><div class="progress-fill" id="progressFill" style="width:0%"></div></div>
  <div class="q-card">
    <div class="q-kind" id="qKind"></div>
    <div class="q-text" id="qText"></div>
  </div>
  <div class="opt-list" id="optList"></div>
  <button class="next-btn" id="nextBtn">السؤال التالي ←</button>
</div>

<!-- RESULT -->
<div class="screen" id="resultScreen">
  <div class="result-wrap">
    <div class="result-emoji" id="resultEmoji">🏆</div>
    <div class="result-title" id="resultTitle">أحسنت!</div>
    <div class="result-sub" id="resultSub"></div>
    <div class="result-score" id="resultScore">0/0</div>
    <div class="result-btns">
      <button class="result-btn primary" id="retryBtn">🔄 إعادة الاختبار</button>
      <button class="result-btn secondary" id="resultHomeBtn">🏠 الصفحة الرئيسية</button>
    </div>
  </div>
</div>

<script>
// ============================================================
//  بيانات المجموعات (الأحداث والتواريخ)
// ============================================================
const GROUPS = {
  domain1:{
    title:'الوثائق التاريخية', sub:'الميدان الأول', icon:'📜', cls:'g1',
    events:[
      {e:'رسالة بولينياك', d:'12 ماي 1830'},
      {e:'رسالة الأمير خالد للرئيس الأمريكي ولسون', d:'23 ماي 1919'}
    ]
  },
  occupation:{

    events:[
      {e:'حادثة المروحة', d:'29 أفريل 1827'},
      {e:'معركة نافارين', d:'20 أكتوبر 1827'},

      {e:'سقوط العاصمة وتوقيع معاهدة الاستسلام', d:'05 جويلية 1830'}
    ]
  },
  colonial:{
    title:'السياسة الاستعمارية والمقاومة الشعبية', sub:'', icon:'⛓️', cls:'g3',
    events:[
      {e:'مرسوم إلحاق الجزائر بفرنسا', d:'22 جوان 1834'},
      {e:'معاهدة التافنة', d:'30 ماي 1837'},

  national:{

      {e:'تأسيس حزب حركة انتصار الحريات الديمقراطية', d:'02 نوفمبر 1946'},

      {e:'إصدار دستور الجزائر (القانون الخاص)', d:'20 سبتمبر 1947'},
      {e:'اكتشاف المنظمة الخاصة', d:'18 مارس 1950'},
      {e:'أزمة حركة انتصار الحريات الديمقراطية', d:'أفريل 1953'}
    ]
  },
  revolution:{
    title:'الثورة التحريرية الكبرى', sub:'1954 - 1962', icon:'🔥', cls:'g5',
    events:[

const ALL_EVENTS = Object.values(GROUPS).flatMap(g=>g.events);

// ============================================================
//  اسم التلميذ ومتابعة التقدم (localStorage)
// ============================================================
const NAME_KEY = 'tarikh4am_student_name';
const PROGRESS_KEY = 'tarikh4am_progress';

function getStudentName(){ return localStorage.getItem(NAME_KEY) || ''; }
function saveStudentName(name){ localStorage.setItem(NAME_KEY, name.trim()); }

function getProgress(){
  try{ return JSON.parse(localStorage.getItem(PROGRESS_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(all){ localStorage.setItem(PROGRESS_KEY, JSON.stringify(all)); }

// يسجل أفضل نتيجة + عدد المحاولات لكل مجموعة
function recordResult(gid, correct, total){
  const all = getProgress();
  const prev = all[gid] || { best:0, total:total, attempts:0 };
  all[gid] = {
    best: Math.max(prev.best, correct),
    total: total,
    attempts: prev.attempts + 1,
    lastScore: correct
  };
  saveProgress(all);
}

// نسبة إتقان كل المجموعات مجتمعة (حسب أفضل نتيجة محفوظة)
function overallProgressPct(){
  const all = getProgress();
  const gids = Object.keys(GROUPS);
  let doneGroups = 0;
  gids.forEach(gid=>{
    const p = all[gid];
    if(p && p.best === p.total && p.total > 0) doneGroups++;
  });
  return Math.round(doneGroups / gids.length * 100);
}

// ============================================================
//  أدوات مساعدة
// ============================================================
function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}

function pickDistractors(correct, pool, count){
  let candidates = shuffle(pool.filter(x=>x!==correct));
  if(candidates.length < count){
    const extra = shuffle(ALL_EVENTS.map(x=>x).filter(x=>!candidates.includes(x) && x!==correct));
    candidates = candidates.concat(extra);
  }
  return candidates.slice(0, count);
}

// ============================================================
//  التنقل بين الشاشات
// ============================================================
function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}
function goHome(){ showScreen('homeScreen'); }

let currentGroupId = null;

function openGroup(gid){
  currentGroupId = gid;
  const g = GROUPS[gid];
  document.getElementById('gmTitle').textContent = g.title;
  document.getElementById('gmSub').textContent = g.sub + ' · ' + g.events.length + ' حدث';

  const name = getStudentName();
  const p = getProgress()[gid];
  const greet = name ? `أهلاً <b>${name}</b> 👋 — ` : '';
  const progText = p
    ? `أفضل نتيجة: <b>${p.best}/${p.total}</b> · عدد المحاولات: <b>${p.attempts}</b>`
    : `لم تخض اختبار هذه المجموعة بعد.`;
  document.getElementById('gmProgressBox').innerHTML = greet + progText;

  showScreen('groupMenuScreen');
}

// ============================================================
//  الصفحة الرئيسية: بناء بطاقات المجموعات
// ============================================================
function renderHome(){
  document.getElementById('studentNameInput').value = getStudentName();

  const wrap = document.getElementById('groupsList');
  wrap.innerHTML = '';
  let total = 0;
  const progress = getProgress();
  Object.entries(GROUPS).forEach(([gid,g])=>{
    total += g.events.length;
    const p = progress[gid];
    const pct = p ? Math.round(p.best / p.total * 100) : 0;
    const badge = p
      ? `<div class="gc-badge">⭐ ${p.best}/${p.total}</div>`
      : `<div class="gc-badge" style="opacity:.6">لم يُختبر بعد</div>`;
    const btn = document.createElement('button');
    btn.className = 'group-card ' + g.cls;
    btn.innerHTML = `
      <div class="gc-icon">${g.icon}</div>
      <div class="gc-body">
        <div class="gc-title">${g.title}</div>
        <div class="gc-sub">${g.sub}</div>
        <div style="display:flex;gap:6px;flex-wrap:wrap;">
          <div class="gc-count">🗓️ ${g.events.length} حدث</div>
          ${badge}
        </div>
        <div class="gc-mini-progress"><div class="gc-mini-fill" style="width:${pct}%"></div></div>
      </div>
      <div class="gc-arrow">◀</div>`;
    btn.addEventListener('click', ()=>openGroup(gid));
    wrap.appendChild(btn);
  });
  document.getElementById('statEvents').textContent = total;
  document.getElementById('statProgress').textContent = overallProgressPct()+'%';
}

// ============================================================
//  الدرس: عرض الأحداث والتواريخ بالترتيب
// ============================================================
function openLesson(){
  const g = GROUPS[currentGroupId];
  document.getElementById('lessonTitle').textContent = g.title;
  document.getElementById('lessonSub').textContent = g.sub;
  const list = document.getElementById('lessonList');
  list.innerHTML = '';
  let lastCat = null;
  g.events.forEach((ev,i)=>{
    if(ev.cat && ev.cat !== lastCat){
      const header = document.createElement('div');
      header.className = 'lesson-cat-header';
      header.textContent = '📌 ' + ev.cat;
      list.appendChild(header);
      lastCat = ev.cat;
    }
    const item = document.createElement('div');
    item.className = 'lesson-item';
    item.style.animationDelay = (Math.min(i,20)*0.03)+'s';
    item.innerHTML = `
      <div class="li-num">${i+1}</div>
      <div class="li-body">
        <div class="li-event">${ev.e}</div>
        <div class="li-date">📅 ${ev.d}</div>
      </div>`;
    list.appendChild(item);
  });
  showScreen('lessonScreen');
}

// ============================================================
//  الاختبار
// ============================================================
let quiz = [];
let qIndex = 0;
let scoreOk = 0;
let scoreNo = 0;
let answered = false;

function buildQuiz(gid){
  const g = GROUPS[gid];
  quiz = shuffle(g.events).map(ev=>{
    const askDate = Math.random() < 0.5;
    let options, correct;
    if(askDate){
      correct = ev.d;
      const distractorDates = pickDistractors(ev, g.events, 3).map(x=>x.d);
      options = shuffle([correct, ...distractorDates]);
    } else {
      correct = ev.e;
      const distractorEvents = pickDistractors(ev, g.events, 3).map(x=>x.e);
      options = shuffle([correct, ...distractorEvents]);
    }
    return { ev, askDate, correct, options };
  });
}

function openQuiz(){
  buildQuiz(currentGroupId);
  qIndex = 0; scoreOk = 0; scoreNo = 0;
  document.getElementById('quizTitle').textContent = GROUPS[currentGroupId].title;
  showScreen('quizScreen');
  renderQuestion();
}

function renderQuestion(){
  answered = false;
  const q = quiz[qIndex];
  document.getElementById('qCounter').textContent = `السؤال ${qIndex+1} من ${quiz.length}`;
  document.getElementById('progressFill').style.width = (qIndex/quiz.length*100)+'%';
  document.getElementById('scoreOk').textContent = scoreOk;
  document.getElementById('scoreNo').textContent = scoreNo;

  const qKind = document.getElementById('qKind');
  const qText = document.getElementById('qText');
  qText.classList.remove('dir-ltr');
  if(q.askDate){
    qKind.textContent = 'متى وقع هذا الحدث؟';
    qText.textContent = q.ev.e;
  } else {
    qKind.textContent = 'ما هو الحدث الموافق لهذا التاريخ؟';
    qText.textContent = q.ev.d;
    qText.classList.add('dir-ltr');
  }

  const optList = document.getElementById('optList');
  optList.innerHTML = '';
  q.options.forEach(opt=>{
    const b = document.createElement('button');
    b.className = 'opt-btn' + (q.askDate ? ' opt-date' : '');
    b.textContent = opt;
    b.addEventListener('click', ()=>selectOption(b, opt));
    optList.appendChild(b);
  });
  document.getElementById('nextBtn').classList.remove('show');
}

function selectOption(btn, opt){
  if(answered) return;
  answered = true;
  const q = quiz[qIndex];
  const isCorrect = opt === q.correct;
  if(isCorrect){ scoreOk++; btn.classList.add('correct'); }
  else { scoreNo++; btn.classList.add('wrong'); }

  document.querySelectorAll('.opt-btn').forEach(b=>{
    b.disabled = true;
    if(b !== btn && b.textContent !== q.correct) b.classList.add('dim');
    if(b.textContent === q.correct) b.classList.add('correct');
  });
  document.getElementById('scoreOk').textContent = scoreOk;
  document.getElementById('scoreNo').textContent = scoreNo;
  document.getElementById('nextBtn').classList.add('show');
}

function nextQuestion(){
  qIndex++;
  if(qIndex >= quiz.length){
    finishQuiz();
  } else {
    renderQuestion();
  }
}

function finishQuiz(){
  document.getElementById('progressFill').style.width = '100%';
  const total = quiz.length;
  const pct = Math.round(scoreOk/total*100);
  let emoji='🎉', title='أحسنت!', sub='نتيجة رائعة، واصل هكذا';
  if(pct < 50){ emoji='💪'; title='حاول مجدداً'; sub='راجع الدرس ثم أعد الاختبار'; }
  else if(pct < 80){ emoji='👍'; title='جيد جداً'; sub='أنت قريب من الإتقان الكامل'; }
  else { emoji='🏆'; title='ممتاز!'; sub='إتقان رائع لهذه المجموعة'; }

  recordResult(currentGroupId, scoreOk, total);
  const name = getStudentName();
  const p = getProgress()[currentGroupId];
  const nameLine = name ? `${name} · ` : '';
  document.getElementById('resultEmoji').textContent = emoji;
  document.getElementById('resultTitle').textContent = title;
  document.getElementById('resultSub').textContent = `${nameLine}${sub} · أفضل نتيجة محفوظة: ${p.best}/${p.total}`;
  document.getElementById('resultScore').textContent = scoreOk+'/'+total;
  showScreen('resultScreen');
  if(pct >= 80) launchConfetti();
}

function launchConfetti(){
  const colors = ['#7c5cfc','#ff6b9d','#ffd166','#06d6a0','#4cc9f0'];
  for(let i=0;i<50;i++){
    setTimeout(()=>{
      const p = document.createElement('div');
      p.className = 'confetti-piece';
      p.style.left = Math.random()*100+'%';
      p.style.background = colors[Math.floor(Math.random()*colors.length)];
      p.style.animationDuration = (Math.random()*1.5+2)+'s';
      document.body.appendChild(p);
      setTimeout(()=>p.remove(), 3600);
    }, i*25);
  }
}

//  النجوم في الخلفية

function createStars(){
  const c = document.getElementById('stars');
  for(let i=0;i<70;i++){
    const s = document.createElement('div');
    s.className = 'star';
    s.style.left = Math.random()*100+'%';
    s.style.top = Math.random()*100+'%';
    s.style.setProperty('--d', (Math.random()*3+2)+'s');
    s.style.setProperty('--del', (Math.random()*3)+'s');
    const sz = Math.random()*2+1;
    s.style.width = sz+'px'; s.style.height = sz+'px';
    c.appendChild(s);
  }
}

let deferredInstallPrompt = null;
const installBtn = document.getElementById('installBtn');

window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  installBtn.classList.add('show');
});

installBtn.addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
  installBtn.classList.remove('show');
});

window.addEventListener('appinstalled', () => {
  installBtn.classList.remove('show');
});
